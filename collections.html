<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#16161a">
    <meta name="description" content="Your recipe collections and meal plans — The Kitchen Notebook.">
    <title>Collections | The Kitchen Notebook</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%2316161a'/%3E%3Ctext x='32' y='44' text-anchor='middle' font-family='serif' font-size='28' font-weight='bold' fill='%23c97d3e'%3EKN%3C/text%3E%3C/svg%3E">
    <link rel="stylesheet" href="css/main.css">
</head>
<body>
    <div class="scroll-progress" id="scrollProgress"></div>
    <div id="nav-placeholder"></div>

    <div class="content-wrapper">
        <main class="reference-page">

            <div class="reference-header">
                <span class="reference-eyebrow">Organisation</span>
                <h1>Collections</h1>
                <p class="reference-description">Group recipes into collections and meal plans. Generate a combined shopping list for any collection.</p>
            </div>

            <!-- Create new collection -->
            <div class="collections-create-bar">
                <input type="text" id="newCollectionInput" class="enh-input"
                    placeholder="New collection name… e.g. Christmas Dinner, Weekly Meal Prep"
                    maxlength="60" aria-label="New collection name">
                <button id="createCollectionBtn" class="enh-btn enh-btn-add">Create Collection</button>
            </div>

            <!-- Collections list -->
            <div id="collectionsContainer">
                <div class="loading-state"><p>Loading collections…</p></div>
            </div>

        </main>
    </div>

    <footer>
        <div class="footer-inner">
            <span class="footer-brand">The Kitchen Notebook</span>
            <p class="footer-copy">&copy; 2026 The Kitchen Notebook.</p>
        </div>
    </footer>

    <button class="back-to-top" id="backToTop" aria-label="Back to top">&#8593;</button>
    <script src="js/nav-loader.js"></script>
    <script src="js/user-prefs.js"></script>
    <script src="js/collections.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#16161a">
    <title>Search Recipes | AJPC Kitchen Notebook</title>
    <link rel="stylesheet" href="css/main.css">
</head>
<body>

    <div class="scroll-progress" id="scrollProgress"></div>
    <div id="nav-placeholder"></div>

    <div class="content-wrapper">
        <main class="search-page">
            <h1>Search Recipes</h1>

            <div style="position:relative;">
                <svg style="position:absolute;left:1.1rem;top:50%;transform:translateY(-50%);color:var(--cream-muted);pointer-events:none;" width="18" height="18" viewBox="0 0 20 20" fill="none" aria-hidden="true">
                    <circle cx="8" cy="8" r="6" stroke="currentColor" stroke-width="2"/>
                    <path d="M12.5 12.5L17 17" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                </svg>
                <input
                    type="text"
                    id="searchInput"
                    class="search-input-large"
                    placeholder="Recipe name, ingredient, tag..."
                    autocomplete="off"
                    autofocus
                    aria-label="Search recipes"
                >
            </div>

            <p class="search-results-count" id="resultsCount"></p>
            <div id="searchResults">
                <p style="color:var(--cream-muted);">Enter a recipe name, ingredient, or tag to search across all 114 recipes.</p>
            </div>
        </main>

        <footer>
            <div class="footer-inner">
                <span class="footer-brand">AJPC</span>
                <p class="footer-copy">&copy; 2026 Ana &amp; John's Kitchen Notebook.</p>
            </div>
        </footer>
    </div>

    <button class="back-to-top" id="backToTop" aria-label="Back to top">&#8593;</button>

    <script src="js/nav-loader.js"></script>
    <script src="js/search.js"></script>
</body>
</html>

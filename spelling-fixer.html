<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recipe Spelling Fixer - American to Australian English</title>
    <style>
        * { box-sizing: border-box; }
        body { background: #0e0e0e; color: #e8e2d9; font-family: 'Segoe UI', Arial, sans-serif; padding: 2rem; margin: 0; }
        h1 { font-family: Georgia, serif; color: #c9a961; margin-bottom: 0.5rem; }
        .subtitle { color: #7a7268; margin-bottom: 2rem; font-size: 0.9rem; }
        .controls { background: #1f1f1f; border: 1px solid #2a2a2a; border-radius: 8px; padding: 1rem; margin-bottom: 2rem; display: flex; gap: 1rem; align-items: center; position: sticky; top: 10px; z-index: 100; }
        button { background: #2a2a2a; border: 1px solid #3a3a3a; color: #e8e2d9; padding: 0.5rem 1rem; border-radius: 4px; cursor: pointer; transition: all 0.2s; }
        button:hover { background: #c9a961; color: #0e0e0e; border-color: #c9a961; }
        button.primary { background: #c9a961; color: #0e0e0e; }
        .files-grid { display: flex; flex-direction: column; gap: 1rem; }
        .file-card { background: #161616; border: 1px solid #2a2a2a; border-radius: 8px; overflow: hidden; }
        .file-header { background: #1f1f1f; padding: 0.75rem 1rem; display: flex; justify-content: space-between; align-items: center; cursor: pointer; }
        .file-name { font-family: monospace; color: #c9a961; }
        .file-status { font-size: 0.7rem; padding: 0.2rem 0.5rem; border-radius: 4px; background: #2a2a2a; }
        .file-status.has-issues { background: #c0392b; color: #fff; }
        .file-status.fixed { background: #27ae60; color: #fff; }
        .file-content { display: none; padding: 1rem; border-top: 1px solid #2a2a2a; }
        .file-card.open .file-content { display: block; }
        .issue-item { background: #0e0e0e; border: 1px solid #2a2a2a; border-radius: 4px; padding: 0.5rem; margin-bottom: 0.5rem; display: flex; flex-direction: column; gap: 0.5rem; }
        .issue-location { font-size: 0.7rem; color: #7a7268; text-transform: uppercase; }
        .issue-text { font-family: monospace; font-size: 0.85rem; padding: 5px; background: rgba(192, 57, 43, 0.1); }
        .suggestion { display: flex; gap: 0.5rem; align-items: center; }
        .suggestion input { background: #1f1f1f; border: 1px solid #3a3a3a; color: #e8e2d9; padding: 0.3rem; flex-grow: 1; font-family: monospace; }
        .summary { background: #1f1f1f; border: 1px solid #2a2a2a; padding: 1rem; margin-bottom: 2rem; border-radius: 8px; }
    </style>
</head>
<body>
    <h1>🔧 Recipe Spelling Fixer</h1>
    <div class="subtitle">Correcting American to Australian English (Chili → Chilli, Yogurt → Yoghurt)</div>

    <div class="controls">
        <button id="scanBtn" class="primary">🔍 Scan All Recipes</button>
        <button id="saveAllBtn">💾 Save All Changes</button>
        <span id="progress" class="progress"></span>
    </div>

    <div id="summary" class="summary" style="display: none;"></div>
    <div id="filesContainer" class="files-grid"></div>

    <script>
        const spellingMap = {
            'red chili powder': 'red chilli powder',
            'Red Chili Powder': 'Red Chilli Powder',
            'red chili': 'red chilli',
            'Red Chili': 'Red Chilli',
            'red chili flakes': 'red chilli flakes',
            'Red Chili Flakes': 'Red Chilli Flakes',
            'dried red chili': 'dried red chilli',
            'Dried Red Chili': 'Dried Red Chilli',
            'dried red chilies': 'dried red chillies',
            'Dried Red Chilies': 'Dried Red Chillies',
            'greek yogurt': 'greek yoghurt',
            'Greek yogurt': 'Greek yoghurt',
            'Greek Yogurt': 'Greek Yoghurt',
            'yogurt': 'yoghurt',
            'Yogurt': 'Yoghurt',
            'chili powder': 'chilli powder',
            'Chili powder': 'Chilli powder'
        };

        const wordMap = {
            'chili': 'chilli',
            'Chili': 'Chilli',
            'chilies': 'chillies',
            'Chilies': 'Chillies'
        };

        // Full list of your recipe files
        const recipeFiles = [
            "alfredosauce.json", "ananaschiavanillapudding.json", "applecinnscrolls.json", "applepie.json", "applestrudel.json",
            "apricotchicken.json", "apricotflan.json", "arrabbiatasauce.json", "baked-cheesecake.json", "bananabread.json",
            "bananacake.json", "beefstockpot.json", "beefstroganoff.json", "beefvindaloo.json", "bistro-brandymustardsteak.json",
            "bistro-carpetbag.json", "bistro-chickenkiev.json", "bistro-chickenpapion.json", "bistro-chickenpicante.json",
            "bistro-chickenriverina.json", "bistro-demiglace.json", "bistro-filetmignon.json", "bistro-fishoftheday.json",
            "bistro-lambcutlets.json", "bistro-mediterraneansteak.json", "bistro-orangethaichicken.json", "bistro-pavlova.json",
            "bistro-profiteroles.json", "bistro-rackoflamb.json", "bistro-reefandbeef.json", "bistro-steakboston.json",
            "bistro-thaichicken.json", "bistro-vealcordonbleu.json", "bistro-vealmadagascar.json", "bistro-vealmozzarella.json",
            "bistro-vealoscar.json", "bistro-vealscaloppine.json", "blueberrymuffins.json", "bulalo.json", "butterchicken.json",
            "cherrycoconutcake.json", "chickencacciatore.json", "chickenmushroombaconpies.json", "chickenshawarma.json",
            "chickenteriyaki.json", "chiligarlicoil.json", "chocmuffins.json", "chocolatemousse.json", "chocolatemugcake.json",
            "chocolaterumballs.json", "chouxpastry.json", "cinnbun.json", "cinntwists.json", "classiccarrotcake.json",
            "cremecaramel.json", "crepes.json", "currychicken.json", "darkrye.json", "doublechocolatechipcookies.json",
            "filipinonoodles.json", "filipinoportoccino.json", "focaccia.json", "focaccia-high.json", "friandsop.json",
            "garlicbread.json", "hamburger.json", "highhydraciab.json", "honeygarlicsauce.json", "honeysoychicken.json",
            "hotdog.json", "hummingbird.json", "kormapaste.json", "lambkorma.json", "lambvindaloo.json", "lamington.json",
            "lasagne.json", "lemoncoconut.json", "lemonmeringuepie.json", "marinarasauce.json", "meatpie.json",
            "mongolianbeef.json", "mongolianlamb.json", "mongoliansauce.json", "mornaysauce.json", "muffinmix.json",
            "mushroomcups.json", "nachomince.json", "orangepoppyseed.json", "pancakesfortwo.json", "pancitbihon.json",
            "pancitcanton.json", "pestosauce.json", "pineappleupsidedowncake.json", "pizzadough.json", "plaincheesecakeclassicnobake.json",
            "porkcaldereta.json", "potatognocchi.json", "puffpastryrough.json", "puffpastrytraditional.json", "redsauce.json",
            "roganjosh.json", "roulade.json", "sataysauce.json", "sausageroll.json", "sourdoughcinnrolls.json", "stickydates.json",
            "sub.json", "swbtm.json", "swbtm2.json", "sweetchilisauce.json", "sweetsourpork.json", "sweetsoursauce_flex.json",
            "sweetsoursauce_quick.json", "sweetspicyorangesauce.json", "tacoseasoning.json", "tangzhongseed.json",
            "teriyakimarinade.json", "teriyakisauce.json", "theultimatechocolatemudcake.json", "tiramisu.json", "tomatoflan.json",
            "traditionalanzacbiscuits.json", "turkishbread.json", "vindaloopaste.json", "whitesauce.json"
        ];

        let recipesData = {};
        const filesContainer = document.getElementById('filesContainer');
        const progressSpan = document.getElementById('progress');
        const summaryDiv = document.getElementById('summary');

        function applySpellingCorrections(text) {
            if (!text || typeof text !== 'string') return text;
            let result = text;
            for (const [american, australian] of Object.entries(spellingMap)) {
                result = result.split(american).join(australian);
            }
            for (const [american, australian] of Object.entries(wordMap)) {
                const regex = new RegExp(`\\b${american}\\b`, 'g');
                result = result.replace(regex, australian);
            }
            return result;
        }

        function hasAmericanSpelling(text) {
            if (!text || typeof text !== 'string') return false;
            return applySpellingCorrections(text) !== text;
        }

        async function loadRecipe(filename) {
            try {
                const response = await fetch(`data/recipes/${filename}?t=${Date.now()}`);
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                const data = await response.json();
                return { filename, data, success: true };
            } catch (error) {
                return { filename, error: error.message, success: false };
            }
        }

        function findIssues(recipe) {
            const issues = [];
            // Check Ingredients
            (recipe.ingredients || []).forEach((ing, idx) => {
                const field = ing.item ? 'item' : (ing.name ? 'name' : null);
                if (field && hasAmericanSpelling(ing[field])) {
                    issues.push({ type: 'ingredient', index: idx, original: ing[field], corrected: applySpellingCorrections(ing[field]), field });
                }
            });
            // Check Method (Instructions)
            (recipe.method || []).forEach((m, idx) => {
                if (hasAmericanSpelling(m.instruction)) {
                    issues.push({ type: 'method', index: idx, original: m.instruction, corrected: applySpellingCorrections(m.instruction) });
                }
            });
            // Check Notes
            (recipe.notes || []).forEach((n, idx) => {
                if (hasAmericanSpelling(n.content)) {
                    issues.push({ type: 'note', index: idx, original: n.content, corrected: applySpellingCorrections(n.content) });
                }
            });
            return issues;
        }

        async function scanAllRecipes() {
            filesContainer.innerHTML = '<h3>Scanning...</h3>';
            recipesData = {};
            let count = 0;
            
            for (const filename of recipeFiles) {
                const result = await loadRecipe(filename);
                if (result.success) recipesData[filename] = result.data;
                count++;
                progressSpan.textContent = `Scanned ${count}/${recipeFiles.length}`;
            }
            renderFiles();
        }

        function renderFiles() {
            let html = '';
            let totalIssues = 0;

            for (const filename of recipeFiles) {
                const data = recipesData[filename];
                if (!data) continue;
                const issues = findIssues(data);
                if (issues.length === 0) continue;

                totalIssues += issues.length;
                const cardId = filename.replace(/\./g, '-');

                html += `
                    <div class="file-card open" id="card-${cardId}">
                        <div class="file-header" onclick="document.getElementById('card-${cardId}').classList.toggle('open')">
                            <span class="file-name">📄 ${filename}</span>
                            <span class="file-status has-issues">${issues.length} issue(s)</span>
                        </div>
                        <div class="file-content">
                            ${issues.map(issue => `
                                <div class="issue-item">
                                    <span class="issue-location">${issue.type} line ${issue.index + 1}</span>
                                    <div class="issue-text">${issue.original}</div>
                                    <div class="suggestion">
                                        <span>→</span>
                                        <input type="text" value="${issue.corrected}" onchange="updateValue('${filename}', '${issue.type}', ${issue.index}, '${issue.field || ''}', this.value)">
                                    </div>
                                </div>
                            `).join('')}
                            <button onclick="saveFile('${filename}')">💾 Save ${filename}</button>
                        </div>
                    </div>
                `;
            }
            filesContainer.innerHTML = html || '<p>✅ No American spelling found in any file!</p>';
            summaryDiv.style.display = 'block';
            summaryDiv.innerHTML = `Found <strong>${totalIssues}</strong> spelling issues.`;
        }

        function updateValue(filename, type, index, field, newValue) {
            const recipe = recipesData[filename];
            if (type === 'ingredient') recipe.ingredients[index][field] = newValue;
            else if (type === 'method') recipe.method[index].instruction = newValue;
            else if (type === 'note') recipe.notes[index].content = newValue;
        }

        async function saveFile(filename) {
            const data = recipesData[filename];
            const jsonString = JSON.stringify(data, null, 2);
            const blob = new Blob([jsonString], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = filename;
            a.click();
            alert(filename + ' downloaded. Please replace the original file.');
        }

        document.getElementById('scanBtn').addEventListener('click', scanAllRecipes);
        document.getElementById('saveAllBtn').addEventListener('click', () => {
            alert("Click the 'Save' button inside each individual file card to download corrected versions.");
        });

        // Start scan automatically
        scanAllRecipes();
    </script>
</body>
</html>

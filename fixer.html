<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Aussie Recipe Scrub & Fixer</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <style>
        body { background: #0e0e0e; color: #e8e2d9; font-family: 'Segoe UI', sans-serif; padding: 40px; line-height: 1.6; }
        .container { max-width: 900px; margin: 0 auto; border: 1px solid #c9a961; padding: 30px; border-radius: 12px; background: #161616; border: 1px solid #c9a961; }
        h1 { color: #c9a961; margin-top: 0; font-family: Georgia, serif; }
        .stats-bar { display: flex; justify-content: space-between; background: #1f1f1f; padding: 15px; border-radius: 8px; margin: 20px 0; border-left: 5px solid #27ae60; }
        .fix-preview { background: #000; padding: 15px; border-radius: 4px; border: 1px solid #333; height: 200px; overflow-y: auto; font-family: monospace; font-size: 0.85rem; margin-bottom: 20px; }
        button { background: #c9a961; color: #0e0e0e; border: none; padding: 18px 30px; font-weight: bold; cursor: pointer; border-radius: 6px; font-size: 1.2rem; width: 100%; transition: 0.2s; }
        button:hover { background: #dfc18d; transform: scale(1.01); }
        button:disabled { background: #444; color: #888; cursor: not-allowed; }
        #log { font-family: monospace; font-size: 0.8rem; max-height: 200px; overflow-y: auto; background: #000; padding: 10px; margin-top: 20px; color: #888; }
        .highlight { color: #c9a961; font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <h1>🇦🇺 Aussie Recipe Scrub & Fixer</h1>
    <p>Scanning 125 files for Americanisms and specific typos found in your word list. <br>
    <small>Note: Nutritional keys (zinc_mg, etc.) are protected and will not be changed.</small></p>

    <div class="fix-preview" id="fixPreview">
        Loading Fix Dictionary...
    </div>

    <div class="stats-bar">
        <span>Files: <strong id="fileCount">125</strong></span>
        <span>Target Words: <strong id="targetCount">0</strong></span>
    </div>
    
    <button id="startBtn">⚡ Fix All Files & Download ZIP</button>

    <div id="log"></div>
</div>

<script>
    // FIX DICTIONARY (Based on your scanned word list)
    const fixMap = {
        // American to Australian
        "chili": "chilli",
        "chilies": "chillies",
        "yogurt": "yoghurt",
        "flavor": "flavour",
        "savory": "savoury",
        "color": "colour",
        "center": "centre",
        "fiber": "fibre",
        "liter": "litre",
        "milliliter": "millilitre",
        "caramelize": "caramelise",
        "caramelized": "caramelised",
        "tenderize": "tenderise",
        
        // Typos found in your specific word list
        "arrabbiatazauce": "arrabbiatasauce",
        "chilligarlicopil": "chilligarlicoil",
        "geletine": "gelatine",
        "ingredietns": "ingredients",
        "ingrediants": "ingredients",
        "maintenence": "maintenance",
        "maintenace": "maintenance",
        "avaliable": "available",
        "availiable": "available",
        "tempreture": "temperature",
        "minuite": "minute",
        "minuites": "minutes",
        "resturant": "restaurant",
        "seperate": "separate",
        "suger": "sugar"
    };

    const recipeFiles = ["alfredosauce.json", "ananaschiavanillapudding.json", "applecinnscrolls.json", "applepie.json", "applestrudel.json", "apricotchicken.json", "apricotflan.json", "arrabbiatasauce.json", "baked-cheesecake.json", "bananabread.json", "bananacake.json", "beefstockpot.json", "beefstroganoff.json", "beefvindaloo.json", "bistro-brandymustardsteak.json", "bistro-carpetbag.json", "bistro-chickenkiev.json", "bistro-chickenpapion.json", "bistro-chickenpicante.json", "bistro-chickenriverina.json", "bistro-demiglace.json", "bistro-filetmignon.json", "bistro-fishoftheday.json", "bistro-lambcutlets.json", "bistro-mediterraneansteak.json", "bistro-orangethaichicken.json", "bistro-pavlova.json", "bistro-profiteroles.json", "bistro-rackoflamb.json", "bistro-reefandbeef.json", "bistro-steakboston.json", "bistro-thaichicken.json", "bistro-vealcordonbleu.json", "bistro-vealmadagascar.json", "bistro-vealmozzarella.json", "bistro-vealoscar.json", "bistro-vealscaloppine.json", "blueberrymuffins.json", "bulalo.json", "butterchicken.json", "cherrycoconutcake.json", "chickencacciatore.json", "chickenmushroombaconpies.json", "chickenshawarma.json", "chickenteriyaki.json", "chiligarlicoil.json", "chocmuffins.json", "chocolatemousse.json", "chocolatemugcake.json", "chocolaterumballs.json", "chouxpastry.json", "cinnbun.json", "cinntwists.json", "classiccarrotcake.json", "cremecaramel.json", "crepes.json", "currychicken.json", "darkrye.json", "doublechocolatechipcookies.json", "filipinonoodles.json", "filipinoportoccino.json", "focaccia.json", "focaccia-high.json", "friandsop.json", "garlicbread.json", "hamburger.json", "highhydraciab.json", "honeygarlicsauce.json", "honeysoychicken.json", "hotdog.json", "hummingbird.json", "kormapaste.json", "lambkorma.json", "lambvindaloo.json", "lamington.json", "lasagne.json", "lemoncoconut.json", "lemonmeringuepie.json", "marinarasauce.json", "meatpie.json", "mongolianbeef.json", "mongolianlamb.json", "mongoliansauce.json", "mornaysauce.json", "muffinmix.json", "mushroomcups.json", "nachomince.json", "orangepoppyseed.json", "pancakesfortwo.json", "pancitbihon.json", "pancitcanton.json", "pestosauce.json", "pineappleupsidedowncake.json", "pizzadough.json", "plaincheesecakeclassicnobake.json", "porkcaldereta.json", "potatognocchi.json", "puffpastryrough.json", "puffpastrytraditional.json", "redsauce.json", "roganjosh.json", "roulade.json", "sataysauce.json", "sausageroll.json", "sourdoughcinnrolls.json", "stickydates.json", "sub.json", "swbtm.json", "swbtm2.json", "sweetchilisauce.json", "sweetsourpork.json", "sweetsoursauce_flex.json", "sweetsoursauce_quick.json", "sweetspicyorangesauce.json", "tacoseasoning.json", "tangzhongseed.json", "teriyakimarinade.json", "teriyakisauce.json", "theultimatechocolatemudcake.json", "tiramisu.json", "tomatoflan.json", "traditionalanzacbiscuits.json", "turkishbread.json", "vindaloopaste.json", "whitesauce.json"];

    const preview = document.getElementById('fixPreview');
    const startBtn = document.getElementById('startBtn');
    const log = document.getElementById('log');
    const targetCountDisp = document.getElementById('targetCount');

    // Show what we are fixing
    preview.innerHTML = Object.entries(fixMap).map(([bad, good]) => `Scrubbing "${bad}" -> "${good}"`).join('<br>');
    targetCountDisp.innerText = Object.keys(fixMap).length;

    function scrubText(text) {
        let result = text;
        // Global -ize to -ise suffix rule (only on word boundaries)
        result = result.replace(/(\w+)ize(s|d|ng)?\b/gi, (match, p1, p2) => {
            let rep = p1 + 'ise' + (p2 || '');
            return match[0] === match[0].toUpperCase() ? rep.charAt(0).toUpperCase() + rep.slice(1) : rep;
        });

        // Dictionary rules
        for (const [bad, good] of Object.entries(fixMap)) {
            const regex = new RegExp('\\b' + bad + '\\b', 'gi');
            result = result.replace(regex, (match) => {
                // Keep capitalization
                return match[0] === match[0].toUpperCase() ? good.charAt(0).toUpperCase() + good.slice(1) : good;
            });
        }
        return result;
    }

    startBtn.addEventListener('click', async () => {
        startBtn.disabled = true;
        const zip = new JSZip();
        let processed = 0;
        log.innerHTML = "Starting deep scrub...<br>";

        for (const filename of recipeFiles) {
            try {
                const response = await fetch(`data/recipes/${filename}?t=${Date.now()}`);
                const rawText = await response.text();
                
                // Perform the scrub
                const fixedText = scrubText(rawText);
                
                // Add to ZIP
                zip.file(filename, fixedText);
                
                processed++;
                log.innerHTML += `✅ Scrubbed: ${filename}<br>`;
                log.scrollTop = log.scrollHeight;
            } catch (err) {
                log.innerHTML += `<span style="color:red">❌ Error: ${filename}</span><br>`;
            }
        }

        zip.generateAsync({type:"blob"}).then(function(content) {
            const link = document.createElement('a');
            link.href = URL.createObjectURL(content);
            link.download = "aussie_scrubbed_recipes.zip";
            link.click();
            log.innerHTML += "<br><strong>Done! ZIP downloaded.</strong>";
        });
    });
</script>

</body>
</html>

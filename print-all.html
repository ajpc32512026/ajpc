<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Print all recipes from Ana & John's Kitchen Notebook in a clean A4 layout.">
    <meta name="theme-color" content="#16161a">
    <title>Print All Recipes | AJPC Kitchen Notebook</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%2316161a'/%3E%3Ctext x='32' y='44' text-anchor='middle' font-family='serif' font-size='28' font-weight='bold' fill='%23c97d3e'%3EAJ%3C/text%3E%3C/svg%3E">
    <link rel="stylesheet" href="css/main.css">
</head>
<body>

    <div class="scroll-progress" id="scrollProgress"></div>
    <div id="nav-placeholder"></div>

    <div class="content-wrapper">
        <main>
            <header class="reference-header">
                <span class="reference-eyebrow">Kitchen Utility</span>
                <h1>Print All Recipes</h1>
                <p class="reference-description">This tool loads every recipe in the notebook into a single queue for high-quality bulk printing (one recipe per page).</p>

                <div class="print-utility-panel">
                    <span id="recipeCount" class="section-note">Scanning index...</span>
                    <label>Sort order:
                        <select id="sortSelect">
                            <option value="alpha">Alphabetical (A-Z)</option>
                            <option value="category">By Category</option>
                        </select>
                    </label>
                    <span id="loadProgress" class="section-note"></span>
                    <button class="toolbar-btn primary" id="printBtn" disabled onclick="window.print()">
                        Print Complete Notebook
                    </button>
                </div>
            </header>

            <!-- Screen Preview -->
            <div class="recipe-preview-list" id="recipeList"></div>

            <!-- Print Engine Target (Hidden on Screen) -->
            <div id="printContent" style="display:none;">
                <div id="printRecipes"></div>
            </div>
        </main>

        <footer>
            <div class="footer-inner">
                <span class="footer-brand">AJPC</span>
                <p class="footer-copy">&copy; 2026 Ana &amp; John's Kitchen Notebook.</p>
                <button class="print-btn" onclick="window.print()">Print View</button>
            </div>
        </footer>
    </div>

    <button class="back-to-top" id="backToTop" aria-label="Back to top">&#8593;</button>

    <script src="js/nav-loader.js"></script>
    <script>
    (function() {
        'use strict';
        let allRecipes = [];

        async function init() {
            let index = [];
            try {
                const res = await fetch('json/recipe-index.json');
                index = await res.json();
            } catch(e) {
                document.getElementById('recipeCount').textContent = 'Index load failed.';
                return;
            }

            let loaded = 0;
            const results = await Promise.allSettled(
                index.map(async entry => {
                    const res = await fetch(`data/recipes/${entry.id}.json`);
                    if (!res.ok) throw new Error(entry.id);
                    const data = await res.json();
                    loaded++;
                    document.getElementById('loadProgress').textContent = `[${loaded}/${index.length}]`;
                    return data;
                })
            );

            allRecipes = results
                .filter(r => r.status === 'fulfilled')
                .map(r => r.value)
                .sort((a, b) => (a.title || '').localeCompare(b.title || ''));

            document.getElementById('recipeCount').textContent = `${allRecipes.length} recipes ready.`;
            document.getElementById('loadProgress').textContent = '';
            
            refreshUI();
            document.getElementById('printBtn').disabled = false;
            document.getElementById('printContent').style.display = 'block';

            document.getElementById('sortSelect').addEventListener('change', () => {
                sortData();
                refreshUI();
            });
        }

        function sortData() {
            const mode = document.getElementById('sortSelect').value;
            if (mode === 'alpha') {
                allRecipes.sort((a, b) => (a.title || '').localeCompare(b.title || ''));
            } else {
                allRecipes.sort((a, b) => {
                    const ca = a.category || '', cb = b.category || '';
                    return ca !== cb ? ca.localeCompare(cb) : (a.title || '').localeCompare(b.title || '');
                });
            }
        }

        function refreshUI() {
            // Update Screen List
            document.getElementById('recipeList').innerHTML = allRecipes.map((r, i) => `
                <div class="recipe-preview-item">
                    <span class="recipe-preview-count">${i + 1}</span>
                    <span class="recipe-preview-title">${esc(r.title || r.id)}</span>
                    <span class="recipe-preview-cat">${esc(r.category || '')}</span>
                </div>`).join('');
            
            // Update Print Engine
            document.getElementById('printRecipes').innerHTML = allRecipes.map(r => `
                <div class="print-recipe-block">
                    ${r.category ? `<span class="print-bulk-category">${esc(r.category)}</span>` : ''}
                    <div class="print-bulk-title">${esc(r.title || r.id)}</div>
                    <p class="print-bulk-desc">${esc(r.description || '')}</p>
                    <div class="print-bulk-meta">
                        ${r.prepTime ? `<div><small>PREP</small><br><b>${esc(r.prepTime)}</b></div>` : ''}
                        ${r.cookTime ? `<div><small>COOK</small><br><b>${esc(r.cookTime)}</b></div>` : ''}
                        ${r.servings ? `<div><small>SERVES</small><br><b>${esc(r.servings)}</b></div>` : ''}
                    </div>
                    <div class="print-bulk-body">
                        <div class="print-bulk-ing">
                            <div class="print-section-heading">Ingredients</div>
                            <ul class="print-ing-list">${(r.ingredients || []).map(ing => `
                                <li><span class="print-qty">${esc(ing.quantity || '')} ${esc(ing.unit || '')}</span> ${esc(ing.item || ing.name || '')}</li>
                            `).join('')}</ul>
                        </div>
                        <div class="print-bulk-meth">
                            <div class="print-section-heading">Method</div>
                            <ol class="print-method-list">${(r.method || []).map(step => `<li>${esc(step.instruction || step)}</li>`).join('')}</ol>
                        </div>
                    </div>
                </div>`).join('');
        }

        function esc(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
        init();
    })();
    </script>
</body>
</html>

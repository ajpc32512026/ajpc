<!DOCTYPE html>
<html>
<head>
    <title>Create Clean Index</title>
</head>
<body>
    <h1>Creating Clean Recipe Index...</h1>
    <pre id="output"></pre>
    <script>
    const RECIPE_FILES = [
        'alfredosauce', 'applecinnscrolls', 'applepie', 'apricotchicken', 'apricotflan',
        'arrabbiatasauce', 'baked-cheesecake', 'bananabread', 'bananacake', 'beefstockpot',
        'beefstroganoff', 'beefvindaloo', 'bistro-brandymustardsteak', 'bistro-carpetbag',
        'bistro-chickenkiev', 'bistro-chickenpapion', 'bistro-chickenpicante', 'bistro-chickenriverina',
        'bistro-filetmignon', 'bistro-fishoftheday', 'bistro-lambcutlets', 'bistro-mediterraneansteak',
        'bistro-orangethaichicken', 'bistro-pavlova', 'bistro-profiteroles', 'bistro-rackoflamb',
        'bistro-reefandbeef', 'bistro-steakboston', 'bistro-thaichicken', 'bistro-vealcordonbleu',
        'bistro-vealmadagascar', 'bistro-vealmozzarella', 'bistro-vealoscar', 'bistro-vealscaloppine',
        'blueberrymuffins', 'bulalo', 'butterchicken', 'chickencacciatore', 'chickenmushroombaconpies',
        'chickenshawarma', 'chickenteriyaki', 'chiligarlicoil', 'chocmuffins', 'chocolatemousse',
        'chocolaterumballs', 'chouxpastry', 'cinnbun', 'cinntwists', 'classiccarrotcake', 'crepes',
        'darkrye', 'doublechocolatechipcookies', 'filipinonoodles', 'filipinoportoccino', 'focaccia',
        'focaccia-high', 'friandsop', 'garlicbread', 'hamburger', 'highhydraciab', 'honeygarlicsauce',
        'hotdog', 'hummingbird', 'kormapaste', 'lambkorma', 'lambvindaloo', 'lamington', 'lasagne',
        'lemoncoconut', 'lemonmeringuepie', 'marinarasauce', 'meatpie', 'mongolianbeef', 'mongolianlamb',
        'mongoliansauce', 'mornaysauce', 'muffinmix', 'mushroomcups', 'nachomince', 'orangepoppyseed',
        'pancitbihon', 'pancitcanton', 'pestosauce', 'pizzadough', 'plaincheesecakeclassicnobake',
        'porkcaldereta', 'potatognocchi', 'redsauce', 'roganjosh', 'roulade', 'sataysauce', 'sausageroll',
        'sourdoughcinnrolls', 'stickydates', 'sub', 'swbtm', 'swbtm2', 'sweetchilisauce', 'sweetsourpork',
        'sweetsoursauce_flex', 'sweetsoursauce_quick', 'sweetspicyorangesauce', 'tacoseasoning',
        'tangzhongseed', 'teriyakimarinade', 'teriyakisauce', 'theultimatechocolatemudcake', 'tiramisu',
        'tomatoflan', 'traditionalanzacbiscuits', 'turkishbread', 'vindaloopaste', 'whitesauce'
    ];

    async function build() {
        const output = document.getElementById('output');
        const cleanIndex = [];
        
        for (const id of RECIPE_FILES) {
            try {
                const res = await fetch(`data/recipes/${id}.json`);
                if (res.ok) {
                    const recipe = await res.json();
                    cleanIndex.push({
                        id: recipe.id,
                        title: recipe.title,
                        emoji: recipe.emoji || '',
                        category: recipe.category || '',
                        tags: recipe.tags || [],
                        description: recipe.description || ''
                    });
                    output.innerHTML += `✅ ${id}\n`;
                } else {
                    output.innerHTML += `❌ ${id} - not found\n`;
                }
            } catch(e) {
                output.innerHTML += `❌ ${id} - error\n`;
            }
        }
        
        cleanIndex.sort((a,b) => (a.title || '').localeCompare(b.title || ''));
        
        const json = JSON.stringify(cleanIndex, null, 2);
        const blob = new Blob([json], {type: 'application/json'});
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'recipe-index-v2.json';
        a.click();
        URL.revokeObjectURL(url);
        
        output.innerHTML += `\n✅ Done! ${cleanIndex.length} recipes indexed.\n📥 Downloaded recipe-index-v2.json`;
    }
    
    build();
    </script>
</body>
</html>

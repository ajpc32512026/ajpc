<!DOCTYPE html>
<html>
<head>
    <title>SCAN YOUR ACTUAL RECIPES FOLDER</title>
    <style>
        body {
            font-family: monospace;
            padding: 20px;
            background: #000;
            color: #0f0;
        }
        button {
            background: #0f0;
            color: #000;
            padding: 20px;
            font-size: 24px;
            font-weight: bold;
            border: none;
            cursor: pointer;
            margin: 20px 0;
        }
        #output {
            background: #111;
            padding: 20px;
            height: 500px;
            overflow-y: auto;
            white-space: pre-wrap;
            font-family: monospace;
        }
        .error { color: #f00; }
        .success { color: #0f0; }
    </style>
</head>
<body>
    <h1>SCAN YOUR RECIPES FOLDER - NO HARDCODED LISTS</h1>
    <button id="scanBtn">CLICK HERE - SELECT YOUR recipes FOLDER</button>
    <div id="output">Ready. Click the button and navigate to: D:\mysites\ajpc\data\recipes</div>

    <script>
        const scanBtn = document.getElementById('scanBtn');
        const output = document.getElementById('output');
        
        scanBtn.addEventListener('click', async () => {
            try {
                // Let user pick the folder
                const dirHandle = await window.showDirectoryPicker();
                output.innerHTML = 'SCANNING EVERY FILE IN: ' + dirHandle.name + '\n\n';
                
                const allRecipes = [];
                let fileCount = 0;
                
                // LOOP THROUGH EVERY SINGLE FILE IN THE FOLDER
                for await (const entry of dirHandle.values()) {
                    // CHECK EVERY FILE that ends with .json
                    if (entry.kind === 'file' && entry.name.endsWith('.json')) {
                        fileCount++;
                        const file = await entry.getFile();
                        const id = entry.name.replace('.json', '');
                        
                        output.innerHTML += `FOUND: ${entry.name}\n`;
                        
                        try {
                            const content = await file.text();
                            const recipe = JSON.parse(content);
                            
                            allRecipes.push({
                                id: id,
                                name: recipe.name || recipe.title || id,
                                category: recipe.category || 'Uncategorized',
                                tags: recipe.tags || [],
                                description: recipe.description || ''
                            });
                            
                            output.innerHTML += `   OK: ${id}\n`;
                        } catch (err) {
                            output.innerHTML += `   ERROR: ${id} - ${err.message}\n`;
                        }
                        
                        // Scroll to bottom
                        output.scrollTop = output.scrollHeight;
                    }
                }
                
                output.innerHTML += `\n━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━\n`;
                output.innerHTML += `TOTAL JSON FILES FOUND: ${fileCount}\n`;
                output.innerHTML += `SUCCESSFULLY PARSED: ${allRecipes.length}\n`;
                output.innerHTML += `━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━\n\n`;
                
                if (allRecipes.length > 0) {
                    // Save the index
                    const json = JSON.stringify(allRecipes, null, 2);
                    const blob = new Blob([json], {type: 'application/json'});
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = 'recipe-index.json';
                    a.click();
                    URL.revokeObjectURL(url);
                    
                    output.innerHTML += `DOWNLOADED: recipe-index.json with ${allRecipes.length} recipes\n`;
                    output.innerHTML += `Save this to: D:\\mysites\\ajpc\\data\\json\\recipe-index.json\n`;
                    
                    // List all found recipes
                    output.innerHTML += `\nALL RECIPES FOUND:\n`;
                    allRecipes.forEach(r => {
                        output.innerHTML += `   - ${r.id}\n`;
                    });
                }
                
            } catch (err) {
                if (err.name !== 'AbortError') {
                    output.innerHTML += `\nERROR: ${err.message}\n`;
                    output.innerHTML += `\nTIP: USE: Chrome, Edge, or Opera browser\n`;
                    output.innerHTML += `TIP: Click ALLOW when prompted\n`;
                }
            }
        });
    </script>
</body>
</html>

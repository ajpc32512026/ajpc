<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#16161a">
    <meta name="description" content="Common cooking techniques, methods, and terms used throughout the The Kitchen Notebook.">
    <title>Culinary Terms | The Kitchen Notebook</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%2316161a'/%3E%3Ctext x='32' y='44' text-anchor='middle' font-family='serif' font-size='28' font-weight='bold' fill='%23c97d3e'%3EKN%3C/text%3E%3C/svg%3E">
    <link rel="stylesheet" href="css/main.css">
</head>
<body>

    <div class="scroll-progress" id="scrollProgress"></div>
    <div id="nav-placeholder"></div>

    <div class="content-wrapper">
        <main class="reference-page">
            
            <div class="reference-header">
                <span class="reference-eyebrow">Reference</span>
                <h1>Culinary Glossary</h1>
                <p class="reference-description">A comprehensive guide to the techniques, methods, and professional terms used throughout the notebook.</p>
            </div>

            <div class="terms-filter" id="termsFilter">
                <button class="letter-btn active" data-letter="all">All</button>
            </div>

            <div id="termsList"></div>
        </main>

        <footer>
            <div class="footer-inner">
                <span class="footer-brand">The Kitchen Notebook</span>
                <p class="footer-copy">&copy; 2026 The Kitchen Notebook.</p>
                <button class="print-btn" onclick="window.print()">Print</button>
            </div>
        </footer>
    </div>

    <button class="back-to-top" id="backToTop" aria-label="Back to top">&#8593;</button>

    <script src="js/nav-loader.js"></script>
    <script>
    (function() {
        const terms = [
            { term: 'Al dente', def: 'Italian for "to the tooth" — pasta or vegetables cooked until tender but still firm when bitten.' },
            { term: 'Amuse-bouche', def: 'A single, bite-sized hors d’oeuvre, different from an appetiser because it is not ordered from a menu, but served free and according to the chef’s selection.' },
            { term: 'Aspic', def: 'A clear jelly made from clarified meat, fish, or vegetable stock and gelatine.' },
            { term: 'Bain-marie', def: 'A water bath used to gently cook or melt ingredients. The container sits in hot water to provide indirect, even heat.' },
            { term: 'Baste', def: 'To spoon, brush, or pour pan juices or fat over food while cooking to add moisture and flavour.' },
            { term: 'Blanch', def: 'Briefly boiling food then plunging it into ice water. Preserves colour and texture, or loosens skins for peeling.' },
            { term: 'Bloom (gelatine)', def: 'Soaking gelatine in cold liquid before heating to dissolve it. Ensures a smooth, lump-free set.' },
            { term: 'Bloom (yeast)', def: 'Activating dried yeast in warm liquid with a pinch of sugar. The mixture should foam within 5-10 minutes.' },
            { term: 'Bouquet Garni', def: 'A bundle of herbs (traditionally parsley, thyme, and bay leaf) tied together and used to flavour soups, stocks, and stews.' },
            { term: 'Braise', def: 'Slow-cooking food in a small amount of liquid in a covered pot. Produces tender, flavourful results, especially for tougher cuts.' },
            { term: 'Brine', def: 'A saltwater solution used to preserve or add moisture to meat and vegetables before cooking.' },
            { term: 'Butterfly', def: 'To cut meat almost in half and open it flat, reducing thickness for faster, more even cooking.' },
            { term: 'Caramelise', def: 'Cooking sugars slowly until they brown and develop complex sweet, nutty, and bitter flavours.' },
            { term: 'Chiffonade', def: 'Slicing leafy vegetables or herbs into fine ribbons by stacking and rolling the leaves before cutting.' },
            { term: 'Clarify', def: 'Removing impurities from butter (to make ghee) or stock (by adding egg whites that attract and trap particles).' },
            { term: 'Confit', def: 'A preservation method where food is cooked and stored in fat at low temperature. Yields extremely tender results.' },
            { term: 'Cure', def: 'Preserving food with salt, sugar, or smoke, which draws out moisture and inhibits bacterial growth.' },
            { term: 'Deglaze', def: 'Adding liquid to a hot pan after searing to dissolve the browned bits (fond) stuck to the bottom. Forms the base of a pan sauce.' },
            { term: 'Dice', def: 'Cutting food into uniform cubes. Small dice = 6mm, medium = 12mm, large = 18mm.' },
            { term: 'Dredge', def: 'Coating food in flour or breadcrumbs before frying by dragging it through the coating.' },
            { term: 'Emulsify', def: 'Combining two liquids that normally do not mix (such as oil and water) by using an emulsifier such as egg yolk or mustard.' },
            { term: 'Flambé', def: 'A cooking procedure in which alcohol (such as brandy or cognac) is added to a hot pan to create a burst of flames.' },
            { term: 'Fold', def: 'Gently incorporating ingredients using a wide, sweeping motion with a spatula to preserve air — especially important in souffles and mousses.' },
            { term: 'Fond', def: 'The browned bits stuck to a pan after searing meat or vegetables. Full of flavour, used as a sauce base.' },
            { term: 'Gastrique', def: 'Caramelised sugar, deglazed with vinegar and used as a flavouring for sauces.' },
            { term: 'Glaze', def: 'Coating food with a sweet or savoury liquid that dries to a shiny finish when cooked.' },
            { term: 'Julienne', def: 'Cutting food into thin matchstick strips, typically 3mm x 3mm x 5-6cm.' },
            { term: 'Knead', def: 'Working dough by pushing, folding, and turning to develop gluten structure, making the dough elastic and smooth.' },
            { term: 'Macerate', def: 'Soaking fruit in sugar, alcohol, or other liquid to soften it and draw out its juices.' },
            { term: 'Marinate', def: 'Soaking food in a seasoned liquid (marinade) before cooking to add flavour and tenderise.' },
            { term: 'Mince', def: 'Cutting food into very small, irregular pieces — smaller than a dice.' },
            { term: 'Mirepoix', def: 'A mixture of sautéed chopped vegetables (traditionally onion, celery, and carrot) used as a flavour base for stocks and sauces.' },
            { term: 'Mise en place', def: 'French for "everything in its place" — the practice of preparing and measuring all ingredients before cooking begins.' },
            { term: 'Nappe', def: 'A term used to describe a sauce that is thick enough to coat the back of a spoon and hold a line drawn through it.' },
            { term: 'Parboil', def: 'Partially cooking food in boiling water before finishing by another method such as roasting or frying.' },
            { term: 'Pinch', def: 'A measurement equivalent to the amount you can hold between your thumb and forefinger (approximately 1/16 of a teaspoon).' },
            { term: 'Poach', def: 'To cook food by submerging it in a liquid (water, milk, stock, or wine) at a temperature just below simmering.' },
            { term: 'Proof (dough)', def: 'Allowing shaped dough to rest and rise before baking. Also called the second rise.' },
            { term: 'Reduce', def: 'Simmering liquid to evaporate water content, concentrating flavour and thickening the sauce.' },
            { term: 'Refresh', def: 'To plunge blanched vegetables into ice water to stop the cooking process immediately and preserve colour.' },
            { term: 'Render', def: 'Slowly heating fatty meat (such as bacon or duck) to melt and extract the fat from the tissue.' },
            { term: 'Rest (meat)', def: 'Allowing cooked meat to sit undisturbed before cutting, so juices redistribute evenly throughout.' },
            { term: 'Roux', def: 'Equal parts fat and flour cooked together, used to thicken sauces and soups. The base of bechamel and many others.' },
            { term: 'Saute', def: 'Quickly cooking food in a small amount of fat over high heat while tossing or stirring frequently.' },
            { term: 'Sear', def: 'Cooking food surface at very high heat until browned and caramelised. Adds flavour through the Maillard reaction.' },
            { term: 'Simmer', def: 'Cooking liquid at a temperature just below boiling, with small, gentle bubbles forming at the surface.' },
            { term: 'Sous-vide', def: 'A method of cooking food in vacuum-sealed bags in a water bath at a precisely regulated temperature.' },
            { term: 'Sweat', def: 'Cooking vegetables in fat over low-medium heat until softened and translucent, without browning them.' },
            { term: 'Tangzhong', def: 'A bread technique where a portion of flour and water is cooked into a paste before mixing. Results in extremely soft, long-lasting crumb.' },
            { term: 'Temper', def: 'Gradually raising the temperature of a cold ingredient (like eggs) by slowly adding hot liquid before combining fully.' },
            { term: 'Truss', def: 'Tying poultry with twine to hold its shape during roasting, ensuring even cooking.' },
            { term: 'Velouté', def: 'A savoury sauce made from a roux and a light stock (fish, chicken, or veal).' },
            { term: 'Zest', def: 'The colourful outer layer of citrus skin, grated or peeled to use the fragrant oils. Avoid the bitter white pith beneath.' },
        ];

        const filterEl = document.getElementById('termsFilter');
        const listEl   = document.getElementById('termsList');

        function render(filter) {
            const filtered = filter === 'all' ? terms : terms.filter(t => t.term[0].toUpperCase() === filter);
            const byLetter = {};
            
            // Sort terms alphabetically within the groups
            filtered.sort((a, b) => a.term.localeCompare(b.term));

            filtered.forEach(t => {
                const l = t.term[0].toUpperCase();
                if (!byLetter[l]) byLetter[l] = [];
                byLetter[l].push(t);
            });

            listEl.innerHTML = Object.entries(byLetter).sort().map(([letter, group]) => `
                <div class="term-group" id="letter-${letter}">
                    <div class="term-group-letter">${letter}</div>
                    ${group.map(t => `
                        <div class="term-entry">
                            <div class="term-name">${t.term}</div>
                            <p class="term-def">${t.def}</p>
                        </div>`).join('')}
                </div>`).join('');
        }

        // Generate Letter Buttons dynamically
        const letters = [...new Set(terms.map(t => t.term[0].toUpperCase()))].sort();
        letters.forEach(l => {
            const btn = document.createElement('button');
            btn.className = 'letter-btn';
            btn.dataset.letter = l;
            btn.textContent = l;
            filterEl.appendChild(btn);
        });

        render('all');

        filterEl.addEventListener('click', (e) => {
            const btn = e.target.closest('.letter-btn');
            if (!btn) return;
            document.querySelectorAll('.letter-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            render(btn.dataset.letter);
        });
    })();
    </script>
</body>
</html>

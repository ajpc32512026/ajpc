<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Update Ingredient Inventory</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%2316161a'/%3E%3Ctext x='32' y='44' text-anchor='middle' font-family='serif' font-size='28' font-weight='bold' fill='%23c97d3e'%3EAJ%3C/text%3E%3C/svg%3E">
<style>
    body { font-family: sans-serif; max-width: 900px; margin: 2rem auto; padding: 1rem; background: #0e0e0e; color: #e8e2d9; }
    h1 { color: #c9a961; }
    button { padding: 0.75rem 1.5rem; font-size: 1rem; cursor: pointer; background: #c9a961; color: #0e0e0e; border: none; border-radius: 4px; font-weight: bold; }
    button:hover { background: #d4b575; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    pre { background: #1a1a1a; padding: 1rem; border-radius: 4px; max-height: 500px; overflow-y: auto; font-size: 0.8rem; white-space: pre-wrap; }
    .status { color: #a89f94; margin: 1rem 0; }
    .error { color: #c0392b; }
    .success { color: #27ae60; }
    .warning { color: #e67e22; }
    .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 1rem; margin: 1rem 0; }
    .stat-card { background: #1a1a1a; padding: 1rem; border-radius: 6px; text-align: center; }
    .stat-number { font-size: 2rem; color: #c9a961; font-weight: bold; }
    .stat-label { font-size: 0.7rem; color: #a89f94; margin-top: 0.25rem; }
</style>
</head>
<body>
    <h1>Update Ingredient Inventory</h1>
    <p>Loads <code>ingredient_inventory_v6.json</code> as the source of truth. Scans all recipes to update <code>usedIn</code> arrays and adds only genuinely new ingredients. V6 data always wins.</p>
    
    <div class="stats">
        <div class="stat-card">
            <div class="stat-number" id="recipeCount">0</div>
            <div class="stat-label">Recipes Scanned</div>
        </div>
        <div class="stat-card">
            <div class="stat-number" id="v6Count">0</div>
            <div class="stat-label">V6 Ingredients</div>
        </div>
        <div class="stat-card">
            <div class="stat-number" id="addedCount">0</div>
            <div class="stat-label">Truly New</div>
        </div>
        <div class="stat-card">
            <div class="stat-number" id="unmatchedCount">0</div>
            <div class="stat-label">Unmatched (Review)</div>
        </div>
    </div>

    <button onclick="updateInventory()" id="updateBtn">Update Inventory</button>
    <p class="status" id="status">Ready. V6 is the source of truth.</p>
    <pre id="output" style="display:none;"></pre>

    <script>
    async function updateInventory() {
        var btn = document.getElementById('updateBtn');
        var status = document.getElementById('status');
        var output = document.getElementById('output');
        var recipeCountEl = document.getElementById('recipeCount');
        var v6CountEl = document.getElementById('v6Count');
        var addedCountEl = document.getElementById('addedCount');
        var unmatchedCountEl = document.getElementById('unmatchedCount');
        
        btn.disabled = true;
        btn.textContent = 'Working...';
        output.style.display = 'none';

        // ── Load existing V6 inventory ──
        var v6Inventory = {};
        try {
            var invRes = await fetch('json/ingredient_inventory_v6.json');
            if (!invRes.ok) throw new Error('V6 not found');
            v6Inventory = await invRes.json();
            status.textContent = 'Loaded V6 inventory: ' + Object.keys(v6Inventory).length + ' ingredients.';
        } catch(e) {
            status.innerHTML = '<span class="error">Could not load V6 inventory: ' + e.message + '</span>';
            btn.disabled = false;
            btn.textContent = 'Update Inventory';
            return;
        }

        v6CountEl.textContent = Object.keys(v6Inventory).length;

        var files = [
            "alfredosauce", "applecinnscrolls", "applepie", "apricotflan",
            "arrabbiatasauce", "baked-cheesecake", "bananabread", "beefstockpot",
            "beefstroganoff", "beefvindaloo", "bistro-brandymustardsteak", "bistro-carpetbag",
            "bistro-chickenkiev", "bistro-chickenpapion", "bistro-chickenpicante", "bistro-chickenriverina",
            "bistro-filetmignon", "bistro-fishoftheday", "bistro-lambcutlets", "bistro-mediterraneansteak",
            "bistro-orangethaichicken", "bistro-pavlova", "bistro-profiteroles", "bistro-rackoflamb",
            "bistro-reefandbeef", "bistro-steakboston", "bistro-thaichicken", "bistro-vealcordonbleu",
            "bistro-vealmadagascar", "bistro-vealmozzarella", "bistro-vealoscar", "bistro-vealscaloppine",
            "blueberrymuffins", "bulalo", "butterchicken", "chickenbaconpies",
            "chickencacciatore", "chickenshawarma", "chickenteriyaki", "chiligarlicoil",
            "chocchipcookies", "chocmuffins", "chocolatemousse", "chocolaterumballs",
            "chouxpastry", "cinnbun", "cinntwists", "classiccarrotcake",
            "crepes", "darkrye", "filipinonoodles", "filipinoportoccino",
            "focaccia", "focaccia-high", "friandsop", "garlicbread",
            "hamburger", "highhydraciab", "honeygarlicsauce", "hotdog",
            "hummingbird", "kormapaste", "lambkorma", "lambvindaloo",
            "lamington", "lasagne", "lemoncoconut", "lemonmeringuepie",
            "marinarasauce", "meatpie", "mongolianbeef", "mongolianlamb",
            "mongoliansauce", "mornaysauce", "muffinmix", "mushroomcups",
            "nachomince", "orangepoppyseed", "pancitbihon", "pancitcanton",
            "pestosauce", "pizzadough", "plaincheesecakeclassicnobake", "porkcaldereta",
            "potatognocchi", "redsauce", "roganjosh", "roulade",
            "sataysauce", "sausageroll", "sourdoughcinnrolls", "stickydates",
            "sub", "swbtm", "swbtm2", "sweetchilisauce",
            "sweetsourpork", "sweetsoursauce_flex", "sweetsoursauce_quick", "sweetspicyorangesauce",
            "tacoseasoning", "tangzhongseed", "teriyakimarinade", "teriyakisauce",
            "theultimatechocolatemudcake", "tiramisu", "tomatoflan", "traditionalanzacbiscuits",
            "turkishbread", "vindaloopaste", "whitesauce"
        ];

        var v6Keys = Object.keys(v6Inventory);
        var v6LowerMap = {};
        for (var k = 0; k < v6Keys.length; k++) {
            v6LowerMap[v6Keys[k].toLowerCase().replace(/[^a-z0-9]/g, '')] = v6Keys[k];
        }

        // Track which recipe IDs use which V6 ingredient
        var usedInMap = {};
        for (var u = 0; u < v6Keys.length; u++) {
            usedInMap[v6Keys[u]] = [];
        }

        var unmatchedItems = {};
        var total = files.length;
        var processed = 0;
        var newlyAdded = 0;

        recipeCountEl.textContent = '0 / ' + total;

        for (var i = 0; i < files.length; i++) {
            var id = files[i];
            try {
                var recipeRes = await fetch('data/recipes/' + id + '.json');
                if (!recipeRes.ok) { processed++; recipeCountEl.textContent = processed + ' / ' + total; continue; }
                
                var recipe = await recipeRes.json();
                var ingredients = recipe.ingredients || [];
                
                for (var j = 0; j < ingredients.length; j++) {
                    var ing = ingredients[j];
                    if (ing.heading) continue;
                    
                    var itemName = (ing.item || ing.name || '').trim();
					if (!itemName || itemName.length < 2) continue;

						// Skip water and placeholders
						var lowerName = itemName.toLowerCase();
						if (lowerName.indexOf('water') !== -1) continue;
						if (lowerName.indexOf('???') !== -1) continue;
						if (lowerName.indexOf('additional sauce ingredients') !== -1) continue;
                    
                    var normalised = itemName.toLowerCase().replace(/[^a-z0-9]/g, '');
                    
                    // Try to match to V6
                    var matchedV6Key = v6LowerMap[normalised];
                    
                    if (!matchedV6Key) {
                        // Fuzzy match — remove plurals, common suffixes
                        for (var v = 0; v < v6Keys.length; v++) {
                            var v6Norm = v6Keys[v].toLowerCase().replace(/[^a-z0-9]/g, '');
                            if (v6Norm === normalised || 
                                v6Norm + 's' === normalised || 
                                normalised + 's' === v6Norm ||
                                v6Norm.indexOf(normalised) !== -1 ||
                                normalised.indexOf(v6Norm) !== -1) {
                                matchedV6Key = v6Keys[v];
                                break;
                            }
                        }
                    }
                    
                    if (matchedV6Key) {
                        if (usedInMap[matchedV6Key].indexOf(id) === -1) {
                            usedInMap[matchedV6Key].push(id);
                        }
                    } else {
                        // Truly unmatched
                        if (!unmatchedItems[itemName]) {
                            unmatchedItems[itemName] = [];
                        }
                        if (unmatchedItems[itemName].indexOf(id) === -1) {
                            unmatchedItems[itemName].push(id);
                        }
                    }
                }
                
                processed++;
                recipeCountEl.textContent = processed + ' / ' + total;
                status.textContent = 'Scanning: ' + id + ' (' + processed + ' of ' + total + ')';
                
            } catch(e) {
                processed++;
                recipeCountEl.textContent = processed + ' / ' + total;
            }
        }

        // Build final inventory — V6 is king
        var finalInventory = {};
        for (var f = 0; f < v6Keys.length; f++) {
            var key = v6Keys[f];
            finalInventory[key] = JSON.parse(JSON.stringify(v6Inventory[key]));
            finalInventory[key].usedIn = usedInMap[key].sort();
            if (!finalInventory[key].aka) finalInventory[key].aka = [];
        }

        // Only add unmatched items that are NOT duplicates
        var unmatchedKeys = Object.keys(unmatchedItems).sort();
        var genuineNew = [];
        for (var u2 = 0; u2 < unmatchedKeys.length; u2++) {
            var item = unmatchedKeys[u2];
            var itemNorm = item.toLowerCase().replace(/[^a-z0-9]/g, '');
            
            // Check if this item already exists under a different name in v6
            var alreadyExists = false;
            for (var v2 = 0; v2 < v6Keys.length; v2++) {
                var v6Norm = v6Keys[v2].toLowerCase().replace(/[^a-z0-9]/g, '');
                if (v6Norm === itemNorm || 
                    v6Norm + 's' === itemNorm || 
                    itemNorm + 's' === v6Norm ||
                    v6Norm.indexOf(itemNorm) !== -1 ||
                    itemNorm.indexOf(v6Norm) !== -1) {
                    // It matches — add to existing V6 entry instead
                    for (var r = 0; r < unmatchedItems[item].length; r++) {
                        if (finalInventory[v6Keys[v2]].usedIn.indexOf(unmatchedItems[item][r]) === -1) {
                            finalInventory[v6Keys[v2]].usedIn.push(unmatchedItems[item][r]);
                        }
                    }
                    finalInventory[v6Keys[v2]].usedIn.sort();
                    // Also add as AKA if not already there
                    if (finalInventory[v6Keys[v2]].aka.indexOf(item) === -1 && item !== v6Keys[v2]) {
                        finalInventory[v6Keys[v2]].aka.push(item);
                    }
                    alreadyExists = true;
                    break;
                }
            }
            
            if (!alreadyExists) {
                finalInventory[item] = {
                    aka: [],
                    category: guessCategory(item),
                    notes: 'Add description here.',
                    usedIn: unmatchedItems[item].sort()
                };
                genuineNew.push(item);
                newlyAdded++;
            }
        }

        var result = JSON.stringify(finalInventory, null, 2);
        
        addedCountEl.textContent = newlyAdded;
        unmatchedCountEl.textContent = genuineNew.length;
        
        status.innerHTML = '<span class="success">Done!</span> V6 had ' + v6Keys.length + ' ingredients. ' + newlyAdded + ' genuinely new ingredients added.';
        if (genuineNew.length > 0) {
            status.innerHTML += '<br><span class="warning">New ingredients to review:</span> ' + genuineNew.join(', ');
        }
        
        output.textContent = result;
        output.style.display = 'block';
        
        var blob = new Blob([result], { type: 'application/json' });
        var a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = 'ingredient_inventory_v6_updated.json';
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        
        btn.disabled = false;
        btn.textContent = 'Update Inventory';
    }

    function guessCategory(name) {
        var n = name.toLowerCase();
        if (/beef|pork|lamb|chicken|bacon|sausage|mince|steak|fillet|rib|shank|brisket|chuck|rump|sirloin|tenderloin|scotch/i.test(n)) return 'Meat';
        if (/fish|salmon|tuna|prawn|shrimp|scallop|mussel|squid|seafood|lobster|crab/i.test(n)) return 'Seafood';
        if (/milk|cream|butter|cheese|yogurt|sour cream|mascarpone|ricotta|mozzarella|parmesan|cheddar|gruyere|feta/i.test(n)) return 'Dairy';
        if (/egg/i.test(n)) return 'Dairy';
        if (/apple|banana|orange|lemon|lime|berry|blueberry|strawberry|raspberry|peach|pear|apricot|cherry|mango|pineapple|fruit|dates|sultana|raisin/i.test(n)) return 'Fruit';
        if (/carrot|onion|potato|tomato|capsicum|broccoli|cauliflower|cabbage|spinach|celery|zucchini|eggplant|pumpkin|mushroom|bean|pea|corn|leek|shallot/i.test(n)) return 'Vegetable';
        if (/flour|wheat|rice|pasta|noodle|bread|oats|barley|quinoa|couscous|polenta|semolina|bran|grain/i.test(n)) return 'Grain';
        if (/almond|walnut|pecan|cashew|pistachio|hazelnut|macadamia|peanut|seed|chia|flax|linseed|sesame|poppy|sunflower|pumpkin|hemp|psyllium/i.test(n)) return 'Nut/Seed';
        if (/basil|oregano|thyme|rosemary|parsley|cilantro|coriander|mint|dill|sage|bay leaf|chive|spice|cinnamon|nutmeg|clove|cardamom|cumin|turmeric|paprika|chili|pepper|ginger|garlic|fennel|mustard|herb|seasoning|masala/i.test(n)) return 'Spice/Herb';
        if (/sugar|honey|syrup|molasses|baking powder|baking soda|bi-carb|bicarb|yeast|vanilla|chocolate|cocoa|gelatin|custard|jam|extract/i.test(n)) return 'Baking';
        if (/sauce|paste|vinegar|oil|stock|broth|wine|liqueur|brandy|rum|mirin|soy|fish sauce|oyster|worcestershire|marinade/i.test(n)) return 'Condiment/Sauce';
        return 'Other';
    }
    </script>
</body>
</html>
